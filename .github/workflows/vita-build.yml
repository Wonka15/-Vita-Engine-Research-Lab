name: VitaSDK native build

on:
  push:
    branches: [main]
    paths:
      - "Prototypes/FirstLight/**"
      - "Prototypes/FirstLightGXM/**"
      - "Documentation/GETTING_STARTED.md"
      - ".github/workflows/vita-build.yml"
  pull_request:
    paths:
      - "Prototypes/FirstLight/**"
      - "Prototypes/FirstLightGXM/**"
      - ".github/workflows/vita-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-first-light:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Build vitaGL and First Light with VitaSDK
        shell: bash
        run: |
          mkdir -p dist
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            vitasdk/vitasdk:2026.08 \
            sh -lc '
              git clone --depth 1 https://github.com/Rinnegatamante/vitaGL.git /tmp/vitaGL
              make -C /tmp/vitaGL install
              cmake -S /workspace/Prototypes/FirstLight \
                -B /tmp/first-light-build \
                -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake"
              cmake --build /tmp/first-light-build --parallel
              test -s /tmp/first-light-build/first_light.vpk
              cp /tmp/first-light-build/first_light.vpk /workspace/dist/Vita-Engine-First-Light-Alpha-0.1.0.vpk
              make -C /workspace/Prototypes/FirstLightGXM clean all
              cp /workspace/Prototypes/FirstLightGXM/first_light_gxm.vpk /workspace/dist/Vita-Engine-First-Light-Direct-GXM-Bringup-0.1.0.vpk
            '

      - name: Upload Alpha VPK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vita-Engine-First-Light-Alpha-0.1.0
          path: dist/Vita-Engine-First-Light-Alpha-0.1.0.vpk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Direct GXM bring-up VPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vita-Engine-First-Light-Direct-GXM-Bringup-0.1.0
          path: dist/Vita-Engine-First-Light-Direct-GXM-Bringup-0.1.0.vpk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: success()
        run: |
          echo "## First Light Alpha build succeeded" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: `Vita-Engine-First-Light-Alpha-0.1.0.vpk`" >> "$GITHUB_STEP_SUMMARY"
          echo "- This confirms packaging only; it does not prove emulator or physical Vita compatibility." >> "$GITHUB_STEP_SUMMARY"
          echo "- Review third-party vitaGL LGPL-3.0 distribution obligations before publishing a public release asset." >> "$GITHUB_STEP_SUMMARY"
