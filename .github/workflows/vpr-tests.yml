name: VPR portable C99 tests

on:
  push:
    branches: [main]
    paths:
      - "Runtime/VitaPerformance/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S Runtime/VitaPerformance -B build/vpr
      - run: cmake --build build/vpr --parallel
      - run: ctest --test-dir build/vpr --output-on-failure
